# Enact configuration for the Enact repository itself.
remote = "origin"
staging_branch = "staging"
master_branch = "master"

[tickets]
project = "en"
url = "https://tickets.thurn.workers.dev"

[checks]
fast = """
  python3 -m py_compile scripts/enact.py && \
  python3 -m unittest -q tests.test_unit && \
  npm --prefix server ci --prefer-offline --no-audit --no-fund && \
  npm --prefix server test && \
  cargo test --locked --manifest-path cli/Cargo.toml
"""
slow = """
  python3 -m unittest -q tests.test_unit tests.test_integration && \
  npm --prefix server ci --prefer-offline --no-audit --no-fund && \
  npm --prefix server test && \
  cargo test --locked --manifest-path cli/Cargo.toml -- --include-ignored
"""

[worktree]
root = ".worktrees"

# Mechanical tickets labeled `tier:light` run on a cheaper model.
[tiers.light.claude]
model = "sonnet"
