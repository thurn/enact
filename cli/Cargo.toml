[package]
name = "tk"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# ureq provides blocking HTTP in place of a curl subprocess. Its rustls
# feature handles TLS in Rust without requiring an OpenSSL installation.
ureq = { version = "3", default-features = false, features = ["rustls"] }
# Derive the command-line parser and help from the same declarations.
clap = { version = "4.6", features = ["derive"] }
# Parse structured API requests and responses, and repository configuration.
serde_json = "1"
toml = "1"
# Use the platform RNG for create request keys that remain stable across retries.
getrandom = "0.4"
# Encode path segments and query values with the URL standard.
url = "2"
# Handle WebSocket framing and upgrades using Rust TLS.
tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
# Hash the bearer token without passing it to an external program.
sha2 = "0.10"
# Stage the private token beside its destination for atomic replacement.
tempfile = "3"
